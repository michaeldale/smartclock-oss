; Smart Weather Clock — from-scratch firmware
; Hardware (reverse-engineered from stock SD/GeekMagic clone, firmware SDPro_V1.0.6):
;   ESP8266 (ESP-12, 4MB) + ST7789 240x240 IPS SPI.  See docs/specifications/hardware.md.

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino

board_build.filesystem = littlefs
; Must match stock: SDPro_V1.0.4/1.0.6 mount LittleFS at 0x40300000-0x405FA000 with
; 256 B pages / 8 KB blocks, i.e. eagle.flash.4m3m.ld. Any other layout would look for
; the filesystem in the wrong place after an OTA over stock (and stage OTA into it).
; 1 MB holds the sketch AND the staged update, hence the size guard in build_options.py.
board_build.ldscript = eagle.flash.4m3m.ld
extra_scripts = pre:scripts/build_options.py, post:scripts/link_options.py

monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
upload_speed = 460800

build_flags =
    ; lwIP without LWIP_FEATURES saves ~10 KB. It drops IP forwarding/NAPT, IP
    ; fragmentation/reassembly, AutoIP, TCP SACK, extra SNTP servers and the hostname
    ; in DHCP DISCOVER (DHCP REQUEST still carries it), none of which this clock uses.
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    ; ---- TFT_eSPI panel config (inlined so no library file edits needed) ----
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_INVERSION_ON=1          ; IPS panel runs inverted (stock sends INVON)
    -D TFT_RGB_ORDER=TFT_BGR       ; MADCTL 0x00; flip to TFT_RGB if colors swap
    -D TFT_MOSI=13                 ; D7  (HSPI)
    -D TFT_SCLK=14                 ; D5  (HSPI)
    -D TFT_CS=15                   ; D8
    -D TFT_DC=0                    ; D3
    -D TFT_RST=2                   ; D4
    -D TFT_BL=-1                   ; backlight handled manually (GPIO5, active-low PWM)
    ; Only fonts actually drawn: every font costs flash, and flash is capped by OTA.
    -D LOAD_FONT2 -D LOAD_FONT4 -D LOAD_FONT6 -D LOAD_FONT8
    -D SPI_FREQUENCY=40000000

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.4
    bitbank2/AnimatedGIF @ ^2.1.1
    bodmer/TJpg_Decoder @ ^1.1.0
